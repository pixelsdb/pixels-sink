status=warn
name=pixels-sink
filter.threshold.type=ThresholdFilter
# allow DEBUG for selected loggers (e.g. DebeziumConsumer receive path)
filter.threshold.level=debug
appender.console.type=Console
appender.console.name=STDOUT
appender.console.layout.type=PatternLayout
appender.console.layout.pattern=%-d{yyyy-MM-dd HH:mm:ss,SSS} [%c]-[%p] %m%n
appender.rolling.type=RollingFile
appender.rolling.name=log
appender.rolling.append=true
appender.rolling.fileName=${env:PIXELS_HOME}/logs/pixels-sink.log
appender.rolling.filePattern=${env:PIXELS_HOME}/logs/pixels-sink-%d{yyyy-MM-dd}-%i.log.gz
appender.rolling.layout.type=PatternLayout
appender.rolling.layout.pattern=%-d{yyyy-MM-dd HH:mm:ss,SSS} [%c]-[%p] %m%n
appender.rolling.policies.type=Policies
appender.rolling.policies.time.type=TimeBasedTriggeringPolicy
appender.rolling.policies.time.interval=1
appender.rolling.policies.time.modulate=true
appender.rolling.policies.size.type=SizeBasedTriggeringPolicy
appender.rolling.policies.size.size=100MB
appender.rolling.strategy.type=DefaultRolloverStrategy
appender.rolling.strategy.max=10
rootLogger.level=info
rootLogger.appenderRef.stdout.ref=STDOUT
rootLogger.appenderRef.log.ref=log
# CDC receive: topic/offset/tx/gtid/binlog pos
logger.debeziumConsumer.name=io.pixelsdb.pixels.sink.source.engine.PixelsDebeziumConsumer
logger.debeziumConsumer.level=debug
logger.debeziumConsumer.additivity=false
logger.debeziumConsumer.appenderRef.stdout.ref=STDOUT
logger.debeziumConsumer.appenderRef.log.ref=log
# Retina batch flush: send / ack (DEBUG), table/txIds/row count
logger.tableCrossFlush.name=io.pixelsdb.pixels.sink.writer.retina.TableCrossTxWriter
logger.tableCrossFlush.level=debug
logger.tableCrossFlush.additivity=false
logger.tableCrossFlush.appenderRef.stdout.ref=STDOUT
logger.tableCrossFlush.appenderRef.log.ref=log
logger.grpc.name=io.grpc.netty.shaded.io.grpc.netty.NettyClientHandler
logger.grpc.level=warn
logger.grpc.additivity=false
logger.grpc.appenderRef.log.ref=log
logger.grpc.appenderRef.stdout.ref=STDOUT
logger.netty-shaded.name=io.grpc.netty.shaded.io.netty
logger.netty-shaded.level=warn
logger.netty-shaded.additivity=false
logger.netty-shaded.appenderRef.log.ref=log
logger.netty-shaded.appenderRef.stdout.ref=STDOUT
